 <!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>WAF Control Panel</title><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><style>body {    margin: 0;    font-family: 'Segoe UI';    background: #020617;    color: #e2e8f0;}.header {    padding: 20px;    background: #020617;    border-bottom: 1px solid #1e293b;}.header h1 {    margin: 0;    color: #38bdf8;}.container {    padding: 20px;}.grid {    display: grid;    grid-template-columns: repeat(4, 1fr);    gap: 15px;}.card {    background: #0f172a;    padding: 15px;    border-radius: 12px;    box-shadow: 0 0 10px rgba(56,189,248,0.1);}.big {    font-size: 28px;    font-weight: bold;}.chart-box {    margin-top: 30px;    background: #0f172a;    padding: 20px;    border-radius: 12px;}.feed {    margin-top: 30px;    max-height: 300px;    overflow-y: auto;    background: #0f172a;    padding: 15px;    border-radius: 12px;}.feed-item {    padding: 8px;    border-bottom: 1px solid #1e293b;    font-size: 13px;}.attack {    color: #ef4444;}</style></head><body><div class="header">    <h1>??? WAF Control Panel</h1></div><div class="container">    <div class="grid">        <div class="card">            <div class="big" id="total">0</div>            Total Requests        </div>        <div class="card">            <div class="big" id="blocked">0</div>            Blocked        </div>        <div class="card">            <div class="big" id="passed">0</div>            Passed        </div>        <div class="card">            <div class="big" id="rate">0%</div>            Block Rate        </div>    </div>    <div class="chart-box">        <canvas id="chart"></canvas>    </div>    <div class="feed" id="feed"></div></div><script>const TOKEN = "CHANGE_ME_NOW";let chart;let history = [];function initChart() {    const ctx = document.getElementById('chart').getContext('2d');    chart = new Chart(ctx, {        type: 'line',        data: {            labels: [],            datasets: [{                label: 'Blocked Requests',                data: [],                borderColor: '#ef4444',                tension: 0.3            }]        }    });}async function loadMetrics() {    const res = await fetch("/__waf/metrics", {        headers: {"X-Metrics-Token": TOKEN}    });    const data = await res.json();    document.getElementById("total").innerText = data.total_requests;    document.getElementById("blocked").innerText = data.blocked;    document.getElementById("passed").innerText = data.passed;    document.getElementById("rate").innerText = data.block_rate_pct + "%";    // Update chart    history.push(data.blocked);    if (history.length > 20) history.shift();    chart.data.labels = history.map((_, i) => i);    chart.data.datasets[0].data = history;    chart.update();    // Feed (simulate recent attacks)    const feed = document.getElementById("feed");    const time = new Date().toLocaleTimeString();    feed.innerHTML = `        <div class="feed-item attack">        ?? Attack detected | Score: ${data.block_rate_pct}% | ${time}        </div>    ` + feed.innerHTML;    if (feed.children.length > 20) {        feed.removeChild(feed.lastChild);    }}initChart();setInterval(loadMetrics, 2000);</script></body></html>
